# Chain configuration for socket backend
backend = "socket"

[config]
# Shared socket configuration
log.console = true
"channel.udp_data_link.host" = "127.0.0.1"
"channel.udp_data_link.port" = 9123
"channel.udp_data_link.dest_host" = "127.0.0.1"
"channel.udp_data_link.dest_port" = 9123

[[handlers]]
name = "sender_udp"
type = "dummy_send"
output_channel = "udp_data_link"
[handlers.config]
"dummy.message" = "Hello through UDP socket!"
"dummy.delay_ms" = 500

[[handlers]]
name = "receiver_udp"
type = "dummy_receive"
input_channel = "udp_data_link"

